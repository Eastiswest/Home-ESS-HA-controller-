name: Release

# HACS shows an "Update" button for a repository that publishes releases, and
# only offers a redownload for one that does not. Tagging is therefore what turns
# a commit into an update people can take without uninstalling and starting
# again -- which also means losing their configuration, so it matters.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the release notes are written from the commits since
          # the previous tag, and a shallow checkout has neither.
          fetch-depth: 0

      # The version HACS reports comes from the tag, and the version Home
      # Assistant reports comes from the manifest. If they disagree, the update
      # appears to install and then the integration claims to be the old
      # version, which is a miserable thing to debug.
      - name: Check the tag matches the manifest
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(python -c "import json;print(json.load(open('custom_components/ess_controller/manifest.json'))['version'])")
          CONST=$(python -c "import re;print(re.search(r'VERSION: Final = \"([^\"]+)\"', open('custom_components/ess_controller/const.py').read()).group(1))")
          echo "tag=$TAG manifest=$MANIFEST const=$CONST"
          if [ "$TAG" != "$MANIFEST" ] || [ "$TAG" != "$CONST" ]; then
            echo "::error::tag $TAG, manifest $MANIFEST and const $CONST must all agree"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The same gates as CI, in the same order. They drifted once -- CI checked
      # formatting and this did not -- so a tag could fail here for a reason that
      # had nothing to do with whether the code worked.
      - name: Run the fast tests before publishing
        run: |
          pip install pytest ruff jinja2
          ruff check custom_components tests
          ruff format --check custom_components tests
          python -m pytest tests/ -q

      # --generate-notes builds the body from merged pull requests, and this
      # repository ships direct commits -- so every release published with it
      # had an empty changelog, and the update dialog in Home Assistant showed
      # a bare version number. The commit subjects are written to carry exactly
      # this information, so the notes are built from them instead.
      - name: Write the release notes from the commits
        run: |
          PREV=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME"^ 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            RANGE="$PREV..$GITHUB_REF_NAME"
            echo "Notes cover $RANGE"
          else
            RANGE="$GITHUB_REF_NAME"
            echo "No previous tag; covering the whole history"
          fi
          {
            echo "## What changed"
            echo
            git log --no-merges --reverse --pretty='- %s' "$RANGE"
            if [ -n "$PREV" ]; then
              echo
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${GITHUB_REF_NAME}"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
